<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <style>
    .bg-main { fill: #07060b; stroke: #191526; stroke-width: 1.5; rx: 14px; }
    .card-panel { fill: #0c0b14; stroke: #201b33; stroke-width: 1.2; rx: 12px; }
    .font-hud { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; fill: #6e6b82; }
    .title { font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: -0.03em; }
    .sub { font-size: 11px; fill: #9d99b3; }
    .chip-bg { fill: #12101c; stroke: #25203b; stroke-width: 1; rx: 8px; }
    .chip-label { font-size: 8.5px; font-weight: 700; fill: #6e6b82; letter-spacing: 0.08em; }
    .chip-val { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .dashed-box { fill: #0a0912; stroke: #26223b; stroke-width: 1.2; stroke-dasharray: 4, 6; rx: 8px; }
    .row-bg { fill: #0e0d17; stroke: #1e1a2f; stroke-width: 1; rx: 6px; }
  </style>

  <rect width="880" height="260" class="bg-main"/>

  <!-- Header -->
  <g transform="translate(24, 20)">
    <text x="0" y="8" class="font-hud eyebrow">AUDIT TRAIL</text>
    <text x="0" y="30" class="font-hud title">Transaction history</text>
    <text x="0" y="46" class="font-hud sub">Allowance lifecycle records plus on-chain Solana activity for your allocation account.</text>

    <!-- Chips -->
    <g transform="translate(630, 4)">
      <rect width="115" height="38" class="chip-bg"/>
      <text x="10" y="15" class="font-hud chip-label">ALLOWANCE TRANSFERS</text>
      <text x="10" y="30" class="font-hud chip-val">0</text>
    </g>
    <g transform="translate(755, 4)">
      <rect width="80" height="38" class="chip-bg"/>
      <text x="10" y="15" class="font-hud chip-label">ON-CHAIN</text>
      <text x="10" y="30" class="font-hud chip-val" fill="#14F195">2</text>
    </g>
  </g>

  <!-- 2-Column Split: Allowance Transfers & On-Chain Horizon/Solana Activity -->
  <g transform="translate(24, 82)">
    <!-- Left: Allowance Transfers (Empty dashed state matching Image 2) -->
    <g transform="translate(0, 0)">
      <text x="0" y="10" class="font-hud eyebrow">ALLOWANCE TRANSFERS</text>
      <text x="390" y="10" text-anchor="end" class="font-hud eyebrow" fill="#4d4a5e">0</text>
      <rect y="18" width="400" height="130" class="dashed-box"/>
      <text x="200" y="88" text-anchor="middle" class="font-hud sub" font-size="12">No Allowance transfers yet.</text>
    </g>

    <!-- Right: On-Chain Activity (Matching Image 2 rows) -->
    <g transform="translate(432, 0)">
      <text x="0" y="10" class="font-hud eyebrow">SOLANA · ALLOCATION ACCOUNT</text>
      <text x="390" y="10" text-anchor="end" class="font-hud eyebrow" fill="#4d4a5e">2</text>

      <!-- Row 1: Payment 1.000000 USDC -->
      <g transform="translate(0, 18)">
        <rect width="400" height="60" class="row-bg"/>
        <text x="16" y="26" class="font-hud" font-size="13" font-weight="700" fill="#ffffff">1.000000 USDC</text>
        <rect x="136" y="13" width="60" height="18" rx="9" fill="#0d1f19" stroke="#14F195" stroke-opacity="0.4"/>
        <text x="166" y="25" text-anchor="middle" class="font-hud eyebrow" fill="#14F195" font-size="8">PAYMENT</text>
        <text x="16" y="45" class="font-hud sub" font-size="9.5">10/31/2026, 11:35:55 AM</text>
        <text x="384" y="26" text-anchor="end" class="font-hud sub" font-size="10.5" font-family="monospace" fill="#00C2FF">733085...e5198a</text>
      </g>

      <!-- Row 2: Create Session / Account -->
      <g transform="translate(0, 84)">
        <rect width="400" height="60" class="row-bg"/>
        <text x="16" y="26" class="font-hud" font-size="13" font-weight="700" fill="#ffffff">Create Session</text>
        <rect x="115" y="13" width="90" height="18" rx="9" fill="#1a122e" stroke="#9945FF" stroke-opacity="0.4"/>
        <text x="160" y="25" text-anchor="middle" class="font-hud eyebrow" fill="#ca9ff5" font-size="8">CREATE SESSION</text>
        <text x="16" y="45" class="font-hud sub" font-size="9.5">10/27/2026, 8:11:04 PM</text>
        <text x="384" y="26" text-anchor="end" class="font-hud sub" font-size="10.5" font-family="monospace" fill="#00C2FF">5b1a5b...53a8a4</text>
      </g>
    </g>
  </g>
</svg>
