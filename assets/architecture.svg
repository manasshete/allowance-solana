<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <linearGradient id="archRamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>

    <linearGradient id="goldRamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffc526"/>
      <stop offset="100%" stop-color="#f48252"/>
    </linearGradient>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .node-box { fill: #0d091a; stroke: #2a1b47; stroke-width: 1.5; rx: 12px; }
    .node-box:hover { stroke: #9945FF; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #8a8a9e; }
    .node-tag { font-family: ui-monospace, monospace; font-size: 9px; font-weight: 700; }
    .wire { stroke: #312154; stroke-width: 2; fill: none; }
    .laser { stroke: url(#archRamp); stroke-width: 2; fill: none; stroke-dasharray: 8, 12; animation: dash 2s linear infinite; }
    .laser-refuse { stroke: url(#goldRamp); stroke-width: 2; fill: none; stroke-dasharray: 6, 8; animation: dash-rev 2s linear infinite; }

    @keyframes dash {
      to { stroke-dashoffset: -20; }
    }
    @keyframes dash-rev {
      to { stroke-dashoffset: 14; }
    }
  </style>

  <!-- Background container -->
  <rect width="880" height="260" rx="14" fill="#06040a" stroke="#1c112e" stroke-width="1.2"/>

  <!-- Connecting Wires -->
  <!-- 1 -> 2 -->
  <path d="M 180 85 L 250 85" class="laser"/>
  <!-- 2 -> 3 -->
  <path d="M 390 85 L 460 85" class="laser"/>
  <!-- 3 -> 4 (Approved Transfer) -->
  <path d="M 620 85 L 690 85" class="laser"/>
  <!-- 3 -> 5 (Refusal Path) -->
  <path d="M 540 125 L 540 175 L 690 175" class="laser-refuse"/>

  <!-- Pulse Photon Dots -->
  <circle r="4" fill="#14F195" filter="url(#laserGlow)">
    <animateMotion path="M 180 85 L 250 85" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#14F195" filter="url(#laserGlow)">
    <animateMotion path="M 390 85 L 460 85" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#14F195" filter="url(#laserGlow)">
    <animateMotion path="M 620 85 L 690 85" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#ffc526" filter="url(#laserGlow)">
    <animateMotion path="M 540 125 L 540 175 L 690 175" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Node 1: AI Agent (Claude / Cursor) -->
  <g transform="translate(40, 45)">
    <rect width="140" height="80" class="node-box" stroke="#7928ca"/>
    <text x="14" y="24" class="node-tag" fill="#ca9ff5">LLM AGENT</text>
    <text x="14" y="44" class="node-title">Claude / Cursor</text>
    <text x="14" y="62" class="node-sub">"Pay 1 to friend"</text>
  </g>

  <!-- Node 2: Allowance MCP Server -->
  <g transform="translate(250, 45)">
    <rect width="140" height="80" class="node-box" stroke="#9945FF"/>
    <text x="14" y="24" class="node-tag" fill="#9945FF">STDIO SERVER</text>
    <text x="14" y="44" class="node-title">Allowance MCP</text>
    <text x="14" y="62" class="node-sub">Resolves contacts &amp; ATA</text>
  </g>

  <!-- Node 3: On-Chain Firewall (Anchor Program) -->
  <g transform="translate(460, 45)">
    <rect width="160" height="80" class="node-box" stroke="#14F195"/>
    <text x="14" y="24" class="node-tag" fill="#14F195">SOLANA PROGRAM</text>
    <text x="14" y="44" class="node-title">Spending Firewall</text>
    <text x="14" y="62" class="node-sub">agent_pay checks caps</text>
  </g>

  <!-- Node 4: Merchant / Friend Token Account (ATA) -->
  <g transform="translate(690, 45)">
    <rect width="150" height="80" class="node-box" stroke="#00C2FF"/>
    <text x="14" y="24" class="node-tag" fill="#00C2FF">SPL TOKEN ATA</text>
    <text x="14" y="44" class="node-title">Recipient Wallet</text>
    <text x="14" y="62" class="node-sub">USDC transferred</text>
  </g>

  <!-- Node 5: On-Chain Refusal Record -->
  <g transform="translate(690, 140)">
    <rect width="150" height="70" class="node-box" stroke="#ffc526"/>
    <text x="14" y="22" class="node-tag" fill="#ffc526">AUDIT TRAIL</text>
    <text x="14" y="40" class="node-title">On-Chain Refusal</text>
    <text x="14" y="56" class="node-sub">OverRequestCap, etc.</text>
  </g>
</svg>
