<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#180a33"/>
      <stop offset="50%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>

    <!-- Solana Neon Gradient -->
    <linearGradient id="solanaRamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9945FF">
        <animate attributeName="stop-color" values="#9945FF; #14F195; #00C2FF; #9945FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#14F195">
        <animate attributeName="stop-color" values="#14F195; #00C2FF; #9945FF; #14F195" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9945FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#14F195" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9945FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #2a164d; stroke-width: 0.8; opacity: 0.25; }
    .pulse-line { stroke: url(#solanaRamp); stroke-width: 2; opacity: 0.8; }
    .orbit-ring { transform-origin: 450px 115px; animation: spin 20s linear infinite; }
    .orbit-ring-rev { transform-origin: 450px 115px; animation: spin-rev 15s linear infinite; }
    .float-shield { transform-origin: 450px 115px; animation: float 4s ease-in-out infinite; }
    .title-glow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Space Grotesk", sans-serif; font-weight: 800; letter-spacing: -0.04em; }
    .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; fill: #ababba; letter-spacing: 0.02em; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-rev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; r: 3; }
      50% { opacity: 1; r: 5; }
    }
  </style>

  <!-- Deep Background -->
  <rect width="900" height="320" rx="18" fill="url(#bgGlow)" stroke="#26173a" stroke-width="1.5"/>

  <!-- Cyber Grid -->
  <g opacity="0.35">
    <line x1="50" y1="0" x2="50" y2="320" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="320" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="320" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="320" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="320" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="320" class="grid-line" />
    <line x1="650" y1="0" x2="650" y2="320" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="320" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="320" class="grid-line" />

    <line x1="0" y1="40" x2="900" y2="40" class="grid-line" />
    <line x1="0" y1="100" x2="900" y2="100" class="grid-line" />
    <line x1="0" y1="160" x2="900" y2="160" class="grid-line" />
    <line x1="0" y1="220" x2="900" y2="220" class="grid-line" />
    <line x1="0" y1="280" x2="900" y2="280" class="grid-line" />
  </g>

  <!-- Animated Glowing Shield Emblem -->
  <g class="float-shield">
    <!-- Outer Orbit Ring -->
    <ellipse cx="450" cy="95" rx="72" ry="32" fill="none" stroke="#9945FF" stroke-width="1.5" stroke-dasharray="6, 8" class="orbit-ring" opacity="0.75" />
    <!-- Inner Orbit Ring -->
    <ellipse cx="450" cy="95" rx="55" ry="24" fill="none" stroke="#14F195" stroke-width="1.5" stroke-dasharray="8, 6" class="orbit-ring-rev" opacity="0.85" />

    <!-- Pulsing Shield Glow -->
    <circle cx="450" cy="95" r="38" fill="url(#solanaRamp)" opacity="0.15" filter="url(#neonGlow)" />
    
    <!-- Shield Core Hexagon / Shield Shape -->
    <polygon points="450,68 476,78 476,104 450,122 424,104 424,78" fill="#120c22" stroke="url(#solanaRamp)" stroke-width="2.5" filter="url(#subtleGlow)"/>
    
    <!-- Solana S Emblem inside Shield -->
    <path d="M438 86 L462 86 L458 90 L434 90 Z" fill="#14F195" />
    <path d="M436 93 L460 93 L464 97 L440 97 Z" fill="#ffffff" />
    <path d="M442 100 L466 100 L462 104 L438 104 Z" fill="#9945FF" />
  </g>

  <!-- Big Title -->
  <text x="450" y="200" text-anchor="middle" class="title-glow" font-size="44" fill="#ffffff" filter="url(#subtleGlow)">
    ALLOWANCE
  </text>
  
  <!-- Gradient Underline Laser -->
  <rect x="250" y="214" width="400" height="2.5" rx="1.25" fill="url(#solanaRamp)" filter="url(#neonGlow)">
    <animate attributeName="width" values="320; 440; 320" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x" values="290; 230; 290" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Subtitle -->
  <text x="450" y="246" text-anchor="middle" class="sub-title">
    On-Chain Spending Firewall &amp; AI Jar for Solana · MCP Agent Engine
  </text>

  <!-- Feature Chips / Badges Row -->
  <g transform="translate(185, 272)">
    <!-- Chip 1: Solana Devnet -->
    <g transform="translate(0, 0)">
      <rect width="160" height="26" rx="13" fill="#100b1d" stroke="#9945FF" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="15" cy="13" r="4" fill="#14F195">
        <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="27" y="17" fill="#ffffff" class="badge-text">SOLANA DEVNET LIVE</text>
    </g>

    <!-- Chip 2: MCP Server -->
    <g transform="translate(175, 0)">
      <rect width="175" height="26" rx="13" fill="#100b1d" stroke="#ca9ff5" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="15" cy="13" r="4" fill="#ca9ff5"/>
      <text x="27" y="17" fill="#ffffff" class="badge-text">CLAUDE &amp; CURSOR MCP</text>
    </g>

    <!-- Chip 3: x402 Micropayments -->
    <g transform="translate(365, 0)">
      <rect width="165" height="26" rx="13" fill="#100b1d" stroke="#14F195" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="15" cy="13" r="4" fill="#14F195"/>
      <text x="27" y="17" fill="#ffffff" class="badge-text">x402 EXACT-SVM</text>
    </g>
  </g>
</svg>
