<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="100%" height="100%">
  <defs>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#9945FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07060b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .bg-main { fill: #07060b; stroke: #191526; stroke-width: 1.5; rx: 14px; }
    .card-panel { fill: #0c0b14; stroke: #201b33; stroke-width: 1.2; rx: 12px; }
    .font-hud { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; fill: #6e6b82; }
    .title { font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: -0.03em; }
    .sub { font-size: 11px; fill: #9d99b3; }
    .chip-bg { fill: #12101c; stroke: #25203b; stroke-width: 1; rx: 8px; }
    .chip-label { font-size: 8.5px; font-weight: 700; fill: #6e6b82; letter-spacing: 0.08em; }
    .chip-val { font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="880" height="310" class="bg-main"/>

  <!-- Header -->
  <g transform="translate(24, 22)">
    <text x="0" y="10" class="font-hud eyebrow">RECIPIENTS</text>
    <text x="0" y="32" class="font-hud title">Contacts</text>
    <text x="0" y="48" class="font-hud sub">Save verified names → Solana address. Ambiguous names block payment until you clarify.</text>

    <!-- Chips -->
    <g transform="translate(560, 4)">
      <rect width="70" height="38" class="chip-bg"/>
      <text x="10" y="15" class="font-hud chip-label">SAVED</text>
      <text x="10" y="30" class="font-hud chip-val">1</text>
    </g>
    <g transform="translate(640, 4)">
      <rect width="90" height="38" class="chip-bg"/>
      <text x="10" y="15" class="font-hud chip-label">RESOLVER</text>
      <text x="10" y="30" class="font-hud chip-val" fill="#55e9ab">● strict mode</text>
    </g>
    <g transform="translate(740, 4)">
      <rect width="95" height="38" class="chip-bg"/>
      <text x="10" y="15" class="font-hud chip-label">POLICY</text>
      <text x="10" y="30" class="font-hud chip-val" fill="#14F195">never guesses</text>
    </g>
  </g>

  <!-- Left Column: 3D Radar Resolver HUD & Saved Contacts -->
  <g transform="translate(24, 88)">
    <rect width="400" height="198" class="card-panel"/>

    <!-- Radar Graphic Minimalist -->
    <g transform="translate(20, 16)">
      <rect width="360" height="96" rx="8" fill="#08070d" stroke="#1c172e"/>
      <!-- Concentric rings -->
      <circle cx="180" cy="48" r="40" fill="none" stroke="#25203b" stroke-dasharray="3, 4"/>
      <circle cx="180" cy="48" r="26" fill="none" stroke="#25203b"/>
      <!-- Radar sweep beam -->
      <circle cx="180" cy="48" r="42" fill="url(#radarSweep)"/>
      <!-- Center Pad -->
      <rect x="166" y="34" width="28" height="28" rx="6" fill="#141120" stroke="#ca9ff5" stroke-width="1.5"/>
      <circle cx="180" cy="48" r="4" fill="#14F195"/>

      <!-- Overlay Text & Toggle -->
      <text x="14" y="24" class="font-hud eyebrow">RESOLVER</text>
      <text x="14" y="42" class="font-hud title" font-size="14">speak a name</text>
      <text x="14" y="58" class="font-hud sub" font-size="9.5">One name, one address — never guesses</text>

      <g transform="translate(276, 36)">
        <rect width="72" height="24" rx="12" fill="#ffffff"/>
        <text x="10" y="16" class="font-hud" font-size="10" font-weight="700" fill="#000000">Standby</text>
        <circle cx="60" cy="12" r="3.5" fill="#000000"/>
      </g>
    </g>

    <!-- Saved Contact Row -->
    <g transform="translate(20, 124)">
      <text x="0" y="10" class="font-hud eyebrow">SAVED CONTACTS</text>
      <rect y="16" width="360" height="42" rx="8" fill="#12101c" stroke="#201b33"/>
      <text x="14" y="34" class="font-hud title" font-size="13">friend</text>
      <text x="14" y="48" class="font-hud sub" font-size="10" font-family="monospace">5FHneW46x...9vJj</text>

      <rect x="290" y="26" width="30" height="22" rx="4" fill="#201b33"/>
      <text x="305" y="40" text-anchor="middle" class="font-hud sub" font-size="9" fill="#14F195">Test</text>
      <rect x="325" y="26" width="22" height="22" rx="4" fill="#201b33"/>
      <text x="336" y="40" text-anchor="middle" class="font-hud sub" font-size="9" fill="#ca9ff5">✕</text>
    </g>
  </g>

  <!-- Right Column: Add Contact & Test Resolver -->
  <g transform="translate(440, 88)">
    <rect width="416" height="198" class="card-panel"/>

    <!-- Add Contact Form Minimalist -->
    <g transform="translate(20, 16)">
      <text x="0" y="10" class="font-hud title" font-size="14">Add contact</text>
      <text x="0" y="22" class="font-hud sub" font-size="9.5">Verified only — AI will use this exact mapping.</text>

      <g transform="translate(0, 28)">
        <rect width="130" height="24" rx="5" fill="#141120" stroke="#25203b"/>
        <text x="8" y="16" class="font-hud sub" font-size="10">Alex</text>

        <rect x="138" y="0" width="180" height="24" rx="5" fill="#141120" stroke="#25203b"/>
        <text x="146" y="16" class="font-hud sub" font-size="10" font-family="monospace">G... or Solana address</text>

        <rect x="326" y="0" width="50" height="24" rx="5" fill="#ffffff"/>
        <text x="351" y="15" text-anchor="middle" class="font-hud" font-size="9.5" font-weight="700" fill="#000000">Save</text>
      </g>
    </g>

    <line x1="20" y1="88" x2="396" y2="88" stroke="#191526" stroke-width="1"/>

    <!-- Test Resolver Section -->
    <g transform="translate(20, 102)">
      <text x="0" y="10" class="font-hud title" font-size="14">Test resolver</text>
      <text x="0" y="22" class="font-hud sub" font-size="9.5">Same logic MCP payments use — name or address.</text>

      <g transform="translate(0, 28)">
        <rect width="316" height="26" rx="6" fill="#141120" stroke="#25203b"/>
        <text x="10" y="17" class="font-hud" font-size="10.5" fill="#ffffff">friend</text>

        <rect x="324" y="0" width="52" height="26" rx="6" fill="#ffffff"/>
        <text x="350" y="17" text-anchor="middle" class="font-hud" font-size="10" font-weight="700" fill="#000000">Resolve</text>
      </g>

      <!-- Resolver Verification Result Output -->
      <g transform="translate(0, 60)">
        <rect width="376" height="24" rx="4" fill="#0e1713" stroke="#14F195" stroke-opacity="0.4"/>
        <circle cx="12" cy="12" r="3.5" fill="#14F195"/>
        <text x="22" y="15.5" class="font-hud" font-size="9.5" font-weight="700" fill="#14F195">Verified Match:</text>
        <text x="96" y="15.5" class="font-hud sub" font-size="9.5" font-family="monospace" fill="#ffffff">friend → 5FHneW46x...9vJj</text>
      </g>
    </g>
  </g>
</svg>
