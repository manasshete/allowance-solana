<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <style>
    .bg-main { fill: #07060b; stroke: #191526; stroke-width: 1.5; rx: 14px; }
    .card-panel { fill: #0c0b14; stroke: #201b33; stroke-width: 1.2; rx: 12px; }
    .font-hud { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; fill: #6e6b82; }
    .title { font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: -0.03em; }
    .sub { font-size: 11px; fill: #9d99b3; }
    .chip-bg { fill: #12101c; stroke: #25203b; stroke-width: 1; rx: 8px; }
    .chip-label { font-size: 8.5px; font-weight: 700; fill: #6e6b82; letter-spacing: 0.08em; }
    .chip-val { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .dashed-box { fill: #0a0912; stroke: #26223b; stroke-width: 1.2; stroke-dasharray: 4, 6; rx: 8px; }
  </style>

  <rect width="880" height="260" class="bg-main"/>

  <!-- Header -->
  <g transform="translate(24, 20)">
    <text x="0" y="8" class="font-hud eyebrow">HUMAN IN THE LOOP</text>
    <text x="0" y="30" class="font-hud title">Approvals</text>
    <text x="0" y="46" class="font-hud sub">Transfers above your session threshold wait here. They expire after two minutes if you do nothing.</text>

    <!-- Chips -->
    <g transform="translate(680, 4)">
      <rect width="70" height="38" class="chip-bg"/>
      <text x="10" y="15" class="font-hud chip-label">PENDING</text>
      <text x="10" y="30" class="font-hud chip-val">0</text>
    </g>
    <g transform="translate(760, 4)">
      <rect width="75" height="38" class="chip-bg"/>
      <text x="10" y="15" class="font-hud chip-label">RESOLVED</text>
      <text x="10" y="30" class="font-hud chip-val">0</text>
    </g>
  </g>

  <!-- 2-Column Split: Pending Queue & Approval History -->
  <g transform="translate(24, 82)">
    <!-- Left: Pending Queue -->
    <g transform="translate(0, 0)">
      <text x="0" y="10" class="font-hud eyebrow">PENDING QUEUE</text>
      <text x="390" y="10" text-anchor="end" class="font-hud eyebrow" fill="#4d4a5e">0</text>
      <rect y="18" width="400" height="130" class="dashed-box"/>
      <text x="200" y="88" text-anchor="middle" class="font-hud sub" font-size="12">No pending approvals.</text>
    </g>

    <!-- Right: Approval History -->
    <g transform="translate(432, 0)">
      <text x="0" y="10" class="font-hud eyebrow">APPROVAL HISTORY</text>
      <text x="390" y="10" text-anchor="end" class="font-hud eyebrow" fill="#4d4a5e">0</text>
      <rect y="18" width="400" height="130" class="dashed-box"/>
      <text x="200" y="88" text-anchor="middle" class="font-hud sub" font-size="12">No resolved approvals yet.</text>
    </g>
  </g>
</svg>
